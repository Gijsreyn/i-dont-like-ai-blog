name: Publish

# Brings the live site up to date with this repository. What did not change is not sent, so the workflow can run
# as often as it likes.
#
#   1. The newest package of the theme is downloaded from Azure Artifacts, where the pipeline of the theme
#      publishes it.
#   2. The action Gijsreyn/ghost-deploy-action uploads that theme when the live site shows another one. It then
#      creates and updates the tags, the pages and the posts whose file differs from the site. After a push it
#      also removes the ones whose file that push removed. What was made in Ghost Admin has no file here and is
#      left alone.
#   3. ./publish.ps1 -SettingsOnly sends the settings of the theme, when there is a staff access token.
#
# It runs for every change to main, once a day to pick up a new package of the theme, and by hand.
#
# Secrets of the repository (Settings > Secrets and variables > Actions):
#
#   GHOST_LIVE_ADMIN_API_KEY    the Admin API key of a custom integration of the live site
#   GHOST_LIVE_STAFF_ACCESS_TOKEN  optional: a staff access token, to also send the settings of the theme.
#                               It may do everything its owner may do. Without it those settings are left alone.
#   AZURE_DEVOPS_EXT_PAT        a personal access token of Azure DevOps with the scope Packaging (Read)
#   AZURE_DEVOPS_ORGANIZATION   the address of the organization, such as https://dev.azure.com/my-org
#   AZURE_DEVOPS_PROJECT        the project of the feed
#   AZURE_ARTIFACTS_FEED        the feed the pipeline of the theme publishes to
#
# Without the last four the theme is left as it is and only the tags, the pages and the posts are published.
on:
  push:
    branches: [main]
    paths:
      - posts/**
      - tags/**
      - pages/**
      - "*.ps1"
      - "*.psd1"
      - tools/**
      - .semgrep/**
      - .github/workflows/publish.yml
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show what would change
        type: boolean
        default: false
      base_ref:
        description: Also remove what was removed from this repository since this commit
        type: string
        default: ""

permissions:
  contents: read

# One publish at a time, and never a half one.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  # A dry run changes nothing on the live site. The summary of the run shows what would change.
  DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}

jobs:
  publish:
    name: Publish to the live site
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    env:
      GHOST_LIVE_ADMIN_API_KEY: ${{ secrets.GHOST_LIVE_ADMIN_API_KEY }}
      GHOST_LIVE_STAFF_ACCESS_TOKEN: ${{ secrets.GHOST_LIVE_STAFF_ACCESS_TOKEN }}
      # The settings of the theme that are not in theme-settings.psd1. One that has no secret is left alone.
      GHOST_THEME_SETTING_CONTENT_API_KEY: ${{ secrets.GHOST_THEME_SETTING_CONTENT_API_KEY }}
      GHOST_THEME_SETTING_GOOGLE_ANALYTICS_ID: ${{ secrets.GHOST_THEME_SETTING_GOOGLE_ANALYTICS_ID }}
      GHOST_THEME_SETTING_AZURE_BLOB_SAS_URI: ${{ secrets.GHOST_THEME_SETTING_AZURE_BLOB_SAS_URI }}
      GHOST_THEME_SETTING_GITHUB_CLIENT_ID: ${{ secrets.GHOST_THEME_SETTING_GITHUB_CLIENT_ID }}
      GHOST_THEME_SETTING_GITHUB_DEVICE_PROXY_URL: ${{ secrets.GHOST_THEME_SETTING_GITHUB_DEVICE_PROXY_URL }}
      AZURE_DEVOPS_EXT_PAT: ${{ secrets.AZURE_DEVOPS_EXT_PAT }}
      AZURE_DEVOPS_ORGANIZATION: ${{ secrets.AZURE_DEVOPS_ORGANIZATION }}
      AZURE_DEVOPS_PROJECT: ${{ secrets.AZURE_DEVOPS_PROJECT }}
      AZURE_ARTIFACTS_FEED: ${{ secrets.AZURE_ARTIFACTS_FEED }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # A key, a token or another secret in a file of the repository stops the run. The secrets above are in the
      # environment of this step too, so their values are looked for as well.
      - name: Look for secrets in the files
        run: ./tools/Test-Secret.ps1

      # The address of the live site and the name of the theme are in site.psd1, which the scripts read as well.
      - name: Read site.psd1
        id: site
        run: |
          $site = Import-PowerShellDataFile -Path ./site.psd1
          $values = "url=$($site.LiveUrl)", "theme-name=$($site.ThemeName)"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value $values

      # The custom theme from Azure Artifacts feed
      - name: Download the theme from Azure Artifacts
        id: theme
        if: env.AZURE_DEVOPS_ORGANIZATION != '' && env.AZURE_ARTIFACTS_FEED != ''
        env:
          THEME_NAME: ${{ steps.site.outputs.theme-name }}
        run: |
          $download = @{
              Organization = $env:AZURE_DEVOPS_ORGANIZATION
              Project      = $env:AZURE_DEVOPS_PROJECT
              Feed         = $env:AZURE_ARTIFACTS_FEED
              Name         = $env:THEME_NAME
              Path         = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'theme'
          }
          $package = ./tools/Get-ThemePackage.ps1 @download
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "path=$($package.FullName)"

      # The theme first, then the tags, the pages and the posts. With delete, a post, a page or a tag whose file a
      # push removed is removed from the site as well. A run by hand has no push to compare with, so it removes
      # only what was removed since the commit in base_ref. The daily run removes nothing.
      - name: Deploy to Ghost
        uses: Gijsreyn/ghost-deploy-action@v1
        with:
          api-url: ${{ steps.site.outputs.url }}
          api-key: ${{ secrets.GHOST_LIVE_ADMIN_API_KEY }}
          theme: ${{ steps.theme.outputs.path }}
          theme-name: ${{ steps.site.outputs.theme-name }}
          tags: tags
          pages: pages
          posts: posts
          delete: true
          base-ref: ${{ inputs.base_ref }}
          dry-run: ${{ env.DRY_RUN }}
          module-version: ${{ env.GHOST_MODULE_VERSION }}

      # The action does not send the settings of the theme. Ghost only lets an owner or an administrator change
      # them, which takes the staff access token. They go last, when the theme they belong to is on the site.
      - name: Send the settings of the theme
        if: env.GHOST_LIVE_STAFF_ACCESS_TOKEN != ''
        run: ./publish.ps1 -SettingsOnly -WhatIf:($env:DRY_RUN -eq 'true') -Confirm:$false
