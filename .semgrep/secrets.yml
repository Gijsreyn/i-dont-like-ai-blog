# The secrets this repository deals with, which the rules of the Semgrep registry (p/secrets) do not know.
# tools/Test-Secret.ps1 runs both. A rule here looks at the form of a secret, in every file that git does not ignore.
rules:
  - id: ghost-admin-api-key
    languages: [generic]
    severity: ERROR
    message: >-
      This has the form of an Admin API key or a staff access token of Ghost. It belongs in the environment, in a
      secret vault or in site.local.psd1, and when it is a real one it has to be replaced on the site.
    pattern-regex: \b[0-9a-f]{24}:[0-9a-f]{64}\b

  - id: azure-storage-sas-signature
    languages: [generic]
    severity: ERROR
    message: >-
      This has the form of the signature of a shared access signature (SAS) of Azure Storage. Whoever has the
      address can read what it gives access to. It belongs in theme-settings.local.psd1 or in a secret.
    pattern-regex: \bsig=[A-Za-z0-9%+/]{30,}

  - id: azure-devops-personal-access-token
    languages: [generic]
    severity: ERROR
    message: >-
      This has the form of a personal access token of Azure DevOps. It belongs in the environment variable
      AZURE_DEVOPS_EXT_PAT or in site.local.psd1.
    pattern-either:
      - pattern-regex: \b[a-z2-7]{52}\b
      - pattern-regex: \b[A-Za-z0-9]{76}AZDO[A-Za-z0-9]{4}\b
